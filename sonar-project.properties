# SonarCloud project configuration
# This file is used by SonarCloud to analyze the code quality of the TagLib-Wasm project

# Project identification
sonar.projectKey=CharlesWiltgen_taglib-wasm
sonar.organization=charles-wiltgen
sonar.projectName=TagLib-Wasm

# sonar.projectVersion is intentionally absent: the workflow derives it from
# package.json at scan time, so the analysis label cannot drift from the
# package version. Do not add a literal here.

# Source code configuration
sonar.sources=src
# Tests live both in the peer tests/ tree and co-located under src/. Listing
# both roots is what lets Sonar classify the co-located *.test.ts files as test
# code; sonar.test.inclusions below narrows each root to the matching files.
sonar.tests=tests,src
# Exclusions include vendor code (lib/), generated files, and non-production
# code. Test globs are deliberately absent: sonar.test.inclusions automatically
# excludes test files from the source scope, and a file cannot be both source
# and test code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/lib/**,lib/**,**/*.d.ts,**/examples/**,**/tools/**,**/scripts/**

# Test configuration
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# No sonar.testExecutionReportPaths: the property requires Sonar's Generic Test
# Data shape, which Vitest's JUnit reporter does not emit. Coverage still flows
# through the lcov paths above.

# Language configuration
# sonar.language is deprecated (and would block multi-language analysis); the
# analyzer derives languages from the file suffixes below.
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Disable C/C++/Objective-C analysis (TagLib source is not analyzed)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# TypeScript configuration
# Node.js is embedded in the SonarJS analyzer; only a tsconfig is configured.
sonar.typescript.tsconfigPaths=tsconfig.json

# Code coverage
# Excludes vendor code and browser/Wasmer-only code untestable in the
# Node/Vitest coverage run. Test files are test scope and never coverage targets.
sonar.coverage.exclusions=**/test-utils.ts,**/examples/**,**/scripts/**,**/tools/**,**/lib/**,src/runtime/wasmer-sdk-loader/**,src/web-utils/canvas.ts,src/web-utils/dom-integration.ts

# Duplication detection (not measured on test code by Sonar)
sonar.cpd.exclusions=**/lib/**

# Encoding
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://github.com/CharlesWiltgen/TagLib-Wasm
sonar.links.ci=https://github.com/CharlesWiltgen/TagLib-Wasm/actions
sonar.links.scm=https://github.com/CharlesWiltgen/TagLib-Wasm
sonar.links.issue=https://github.com/CharlesWiltgen/TagLib-Wasm/issues

