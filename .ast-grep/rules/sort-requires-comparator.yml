id: sort-requires-comparator
language: typescript
severity: error
message: Call sort()/toSorted() with a comparator (Sonar S2871)
note: |
  Array.prototype.sort() and toSorted() without a comparator use the default
  string coercion, which is lexicographic and coercion-dependent. Supply the
  ordering explicitly:

    names.sort((a, b) => a.localeCompare(b));
    numbers.toSorted((a, b) => a - b);

  This is SonarCloud's typescript:S2871, enforced locally so a new violation
  fails `pnpm run check:all` instead of waiting for the Sonar gate. Suppress a
  deliberate custom sort with `// ast-grep-ignore` on the call.

  Optional chaining (`items?.sort()`) and an explicit `undefined` comparator
  (`items.sort(undefined)`) select the same default comparator, so they are
  covered too.
files:
  - "src/**"
rule:
  any:
    - pattern: $RECEIVER.sort()
    - pattern: $RECEIVER.toSorted()
    - pattern: $RECEIVER?.sort()
    - pattern: $RECEIVER?.toSorted()
    - pattern: $RECEIVER.sort(undefined)
    - pattern: $RECEIVER.sort?.(undefined)
    - pattern: $RECEIVER.toSorted(undefined)
    - pattern: $RECEIVER.toSorted?.(undefined)
