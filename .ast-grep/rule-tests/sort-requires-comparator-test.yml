id: sort-requires-comparator
valid:
  # Explicit string ordering.
  - "names.sort((a, b) => a.localeCompare(b));"
  # Explicit numeric ordering.
  - "counts.toSorted((a, b) => a - b);"
  # Any comparator is enough; the rule only cares that one is present.
  - "items.sort(compare);"
  - "items.toSorted(compare);"
invalid:
  # The Sonar S2871 shape: default string coercion.
  - "names.sort();"
  - "counts.toSorted();"
  # Same call through optional chaining or an explicit undefined comparator.
  - "names?.sort();"
  - "counts?.toSorted();"
  - "names.sort(undefined);"
  - "counts.toSorted(undefined);"
  - "names.sort?.(undefined);"
  - "counts.toSorted?.(undefined);"
