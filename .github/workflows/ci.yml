name: Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_wasi:
        description: "Skip WASI build"
        required: false
        default: false
        type: boolean

# Least privilege: every job here reads the repository (checkout, artifacts) and
# writes only to the step summary. Review finding SEC-03.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Run linter
        # No --type-aware: vite.config.ts's lint.options.typeAware already
        # enables the type-checked rules (oxlint documents the flag as
        # equivalent), so passing it here was a second source of truth.
        run: pnpm exec vp lint

      - name: Materialize the glue wrappers for the type check
        # dist/ is gitignored, so a fresh checkout has none, and three modules
        # import the Emscripten glue from dist/taglib-wrapper.js — `tsc` then
        # fails with TS2307 before any build has run (measured: the identical
        # three errors with dist/ hidden, green after `pnpm run build:copy-wasm`).
        # Same class of fix as the parity-test step in the `test` job, which
        # materializes the committed WASI binary for the same reason. The
        # pre-migration lint job used `deno check`, which did not need it.
        run: pnpm run build:copy-wasm

      - name: Type check
        # tsconfig.check.json is tests-inclusive: tsconfig.json excludes tests
        # (it is the dist build's config), so this config is what type-checks
        # tests/ and src/ together.
        run: pnpm exec tsc --noEmit -p tsconfig.check.json

      - name: Type check the examples
        # examples/ is excluded from tsconfig.check.json, so this config is its
        # only type gate (taglib-1zn1). It joins src/global.d.ts for the Deno
        # globals and needs the glue wrappers materialized above.
        run: pnpm exec tsc --noEmit -p tsconfig.examples.json

      - name: Examples gate
        # Resolution + run + working-tree guard (scripts/check-examples.ts). A
        # guard that does not run in CI is decoration; the Lint job is the one
        # non-matrix job, and nothing here is OS-specific.
        run: pnpm run check:examples

      - name: Install ast-grep
        # Global CLI tools stay on npm: npm's global bin dir is on PATH on every
        # runner. pnpm owns the project's dependency graph, not runner tooling.
        run: npm install -g @ast-grep/cli@0.45.1

      - name: Lint with ast-grep structural rules
        # The install above was decoration until now: nothing invoked ast-grep in
        # CI after the Deno-era `lint:ast` task was retired, yet the docs-coverage
        # comment below calls an unrun guard "decoration". The script itself
        # no-ops with a warning if ast-grep is absent, so it is safe on any runner.
        run: pnpm run lint:ast

      - name: Verify docs coverage of public exports
        # Local-only gate made mandatory: flags a shipped export that no doc
        # mentions (name-mention check, not accuracy). A guard that does not
        # run in CI is decoration — the same rule as the ast-grep step above.
        run: pnpm run docs:coverage

      - name: Lint GitHub Actions workflows
        # The release path lives entirely in .github/workflows/*, and nothing
        # else validates it: a malformed workflow dies at GitHub's parser with
        # no step-level detail, and workflow edits are made far more often than
        # they are exercised. This catches that class — invalid YAML, unknown
        # contexts, bad expressions, wrong step shape.
        #
        # shellcheck is on: the pre-existing findings were cleaned (redirect
        # targets quoted; the three intentional cases carry inline
        # '# shellcheck disable=' comments with reasons), so this pass is
        # signal rather than noise.
        #
        # Pinned by commit SHA (SEC-07). A tag is mutable, and this action runs
        # in the workflow that gates the release path. The trailing tag comment
        # is what keeps the pin maintainable: v2.2.0 was verified to be a
        # lightweight tag pointing directly at a commit (not another tag) with
        # `gh api repos/raven-actions/actionlint/git/ref/tags/v2.2.0`, which
        # reports object type `commit`, sha 3d39aea….
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          shellcheck: true

      - name: Verify no unused exports or dependencies (knip)
        # Local-only gate made mandatory: dead exports and orphaned deps rot
        # silently otherwise. knip is pinned in devDependencies and the script
        # uses `pnpm exec` (which never fetches), so the analyzed version is
        # deterministic rather than whatever a resolver would fetch. The strict
        # (production-mode) pass is the only one that reports a devDependency
        # imported from src/ - the class that ships as a missing runtime
        # dependency - so it runs here too rather than only in a local check:all.
        run: pnpm run knip && pnpm run knip:strict

      - name: Verify toolchain pins agree across files
        # The wasm freshness gates byte-compare fresh builds against the
        # committed binaries, so a toolchain bump that misses one pin (three
        # workflow files + build/setup-dev-env.sh for emsdk; ci.yml + setup
        # scripts for wasi-sdk/binaryen) reds the pipeline with a confusing
        # "binary is stale" error. This fails fast at the pins instead; also
        # runs in the local check:all gate.
        run: bash scripts/check-toolchain-pins.sh

  bundle:
    name: Bundle (fast)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bundle the TS entry points through `vp pack` (seconds, no Emscripten/WASI).
      # Use `pnpm run build:js`, NOT `pnpm run build:ts`: build:ts also runs `tsc`,
      # which fails in a fresh checkout because dist/taglib-wrapper.js (a
      # wasm-build artifact) is absent. The pack configs externalize that wrapper
      # and fail on any unresolvable bare specifier, so this still catches
      # bundler-resolution regressions without the multi-minute build-embind job.
      - name: Build TypeScript bundles
        run: pnpm run build:js

      - name: Materialize the runtime files for the resolution check
        # `vp pack` keeps the source-shaped glue/wasm specifiers; postbuild
        # copies the runtime files into dist/ and applies the depth-relative
        # fixes that make every emitted reference resolve.
        run: pnpm run postbuild

      - name: Verify the emitted dist tree resolves
        # Every relative specifier and import.meta.url asset reference in the
        # emitted tree must resolve on disk: dist/** is load-bearing at
        # runtime for the Node entries, and no earlier gate walks it.
        run: node scripts/check-dist-resolution.mjs

      - name: Verify disc-folder entry stays Wasm-free
        # taglib-cd7b: the disc-folder subpath is DECLARED dependency-free so
        # clients (tuneup) can import discFolderInfo without a wasm runtime.
        # scripts/check-disc-folder.mjs rebuilds the subpath from the pack
        # config, byte-compares it against the shipped artifact, and walks the
        # source graph to prove nothing outside the pure allowlist was pulled in.
        run: node scripts/check-disc-folder.mjs

      - name: Verify npm package ships no stray C++/CMake
        # taglib-asy / taglib-qrp: a subtree once shipped ~88 C++/CMake files
        # to a registry. package.json `files` is an allowlist, so `npm pack`
        # cannot reproduce that check — this asserts the allowlist itself and
        # the packed tarball contents.
        run: bash scripts/check-package-files.sh

  test-capi-cpp:
    name: Test (C API C++ unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run C++ unit tests
        run: bash tests/run-capi-tests.sh

  build-embind:
    name: Build (Embind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.12

      - name: Build WebAssembly
        # Emscripten-only by design: this job installs emsdk but not the WASI
        # SDK. The WASI backend is built by the separate build-wasi job.
        run: pnpm run build:wasm:emscripten

      # Byte-compare freshness gate (taglib-peml): build-wasm.sh pins
      # BINARYEN_ROOT to emsdk's vendored Binaryen, so the fresh rebuild must
      # be byte-identical to the committed artifacts. The wrapper is covered
      # too: build-wasm.sh applies the Deno compatibility patches
      # (scripts/fix-deno-compat.js) before the compare, exactly as the
      # committed wrapper was produced, so a fresh build must not change it
      # either. Comment-only C++ edits produce identical bytes and pass.
      - name: Verify committed Emscripten binary is fresh
        run: |
          if ! git diff --quiet -- build/taglib-web.wasm build/taglib-wrapper.js; then
            echo "::error::build/taglib-web.wasm or build/taglib-wrapper.js is stale — the fresh build differs from the committed artifacts."
            echo "Rebuild with 'pnpm run build:wasm:emscripten', then commit the updated artifacts."
            git diff --stat -- build/taglib-web.wasm build/taglib-wrapper.js
            exit 1
          fi
          echo "build/taglib-web.wasm and build/taglib-wrapper.js match the fresh build"

      # The gate above fails on exactly the state a toolchain bump starts in
      # (committed bytes predate the new emsdk). Publish the fresh build as the
      # reference to commit, mirroring wasi-fresh-reference below.
      - name: Upload fresh Emscripten binaries (reference for the committed copy)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: embind-fresh-reference
          path: |
            build/taglib-web.wasm
            build/taglib-wrapper.js
            build/taglib-wrapper.d.ts
          retention-days: 1

      # Hard gate: the Emscripten wasm must actually instantiate on Node. The
      # unit suite skips the Emscripten backend on load-failure (so a broken
      # wasm stays green); this fails the build instead. Catches wasm/glue
      # import-module mismatches (the 1.4.1 "./a" regression) before publish.
      - name: Emscripten smoke test (must instantiate on Node)
        run: pnpm exec tsx scripts/smoke-emscripten.ts

      - name: WASI smoke test (must instantiate on Node)
        run: pnpm exec tsx scripts/smoke-wasi.ts

      - name: Copy WASM files to dist
        run: |
          mkdir -p dist
          cp build/taglib-web.wasm dist/
          cp build/taglib-wrapper.js dist/
          cp build/taglib-wrapper.d.ts dist/

      - name: Build TypeScript
        run: pnpm run build:ts

      - name: Run postbuild
        run: pnpm run postbuild

      - name: Smoke the emitted dist tree (both backends)
        # Nothing else executes dist/: every test and both smoke-*.ts scripts
        # import src/, so a bundler/lowering/postbuild regression that only
        # affects the shipped artifacts could pass everything else. This runs
        # the artifact end to end on both backends — initialize from
        # dist/index.js, write a tag to a fixture copy, read it back.
        run: pnpm run smoke:dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embind-build
          path: |
            dist/
            build/taglib-web.wasm
            build/taglib-wrapper.js
            build/taglib-wrapper.d.ts
          retention-days: 1

  build-wasi:
    name: Build (WASI)
    runs-on: ubuntu-24.04
    if: ${{ !inputs.skip_wasi }}
    env:
      # Single source for the SDK version in this job: cache path/key and the
      # setup step below all read it, so a bump edits one line (the
      # scripts/check-toolchain-pins.sh guard keeps it in sync with the other
      # files that pin wasi-sdk).
      # Quoted on purpose: unquoted, 33.0 parses as a YAML float and the
      # runner stringifies it to "33", which breaks the download URL.
      WASI_VERSION: "34.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ~100MB tarball from GitHub Releases on every run: cache the unpacked
      # SDK so a transient download failure (429/503) can't red the pipeline,
      # and cache hits skip the download entirely. A version bump is a clean
      # miss (exact key, no restore-keys).
      - name: Cache WASI SDK
        uses: actions/cache@v6
        with:
          path: build/wasi-sdk/wasi-sdk-${{ env.WASI_VERSION }}-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-${{ env.WASI_VERSION }}

      - name: Setup WASI SDK
        run: |
          set -euo pipefail
          WASI_SDK_DIR="$(pwd)/build/wasi-sdk/wasi-sdk-${WASI_VERSION}-x86_64-linux"
          if [ ! -x "$WASI_SDK_DIR/bin/clang++" ]; then
            echo "Downloading WASI SDK ${WASI_VERSION}..."
            mkdir -p build/wasi-sdk
            cd build/wasi-sdk
            WASI_URL="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION%%.*}/wasi-sdk-${WASI_VERSION}-x86_64-linux.tar.gz"
            # Retry: GitHub release downloads from hosted runners occasionally
            # 429/503; a transient fetch failure must not red the pipeline.
            for attempt in 1 2 3; do
              if curl -fL --retry 3 --retry-delay 5 --retry-all-errors -o wasi-sdk.tar.gz "$WASI_URL" \
                  && tar xf wasi-sdk.tar.gz; then
                rm -f wasi-sdk.tar.gz
                break
              fi
              echo "::warning::WASI SDK download attempt ${attempt} failed; retrying in 5s"
              sleep 5
            done
            if [ ! -x "$WASI_SDK_DIR/bin/clang++" ]; then
              echo "::error::Failed to download WASI SDK ${WASI_VERSION} (3 attempts)"
              exit 1
            fi
          else
            echo "WASI SDK ${WASI_VERSION} present (cache hit)"
          fi
          echo "WASI_SDK_PATH=$WASI_SDK_DIR" >> "$GITHUB_ENV"
          echo "$WASI_SDK_DIR/bin" >> "$GITHUB_PATH"

      - name: Install wasm-opt (binaryen) and ninja
        # binaryen is pinned at 132.0.0 — the same version as emsdk 6.0.12's
        # vendored Binaryen — so the WASI rebuild is byte-deterministic and
        # the freshness compare below is meaningful (taglib-peml).
        #
        # npm is the installer for global CLI tools (its global bin dir is on
        # PATH on every runner, and pnpm's is not); project dependencies are
        # pnpm's. The job's former ~/.npm cache step went with the npm lockfile
        # it keyed on.
        run: |
          npm install -g binaryen@132.0.0
          # ninja-build ships on ubuntu-24.04 images; apt is only a fallback
          # so a runner-image change never hard-fails on a package fetch.
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get install -y ninja-build
          fi

      # The stock WASI SDK sysroot (33+) ships C++ exceptions (eh/ multilib), so
      # the previous custom EH-sysroot build (build-eh-sysroot.sh) is no longer
      # needed — build-wasi.sh links against the SDK's stock eh/ libs (taglib-sgh).

      - name: Cache WASI build
        uses: actions/cache@v6
        with:
          path: |
            build/wasi
          key: ${{ runner.os }}-wasi-${{ hashFiles('lib/taglib/**/*.cpp', 'lib/taglib/**/*.h', 'src/capi/**', 'build/build-wasi.sh') }}

      - name: Build with WASI SDK
        run: |
          chmod +x build/build-wasi.sh
          # The generated env script must contain literal $WASI_SDK_PATH
          # expansions — only the %s is substituted here.
          # shellcheck disable=SC2016
          printf '#!/bin/bash\nexport WASI_SDK_PATH="%s"\nexport PATH="$WASI_SDK_PATH/bin:$PATH"\necho "WASI SDK environment configured"\n' "$WASI_SDK_PATH" > build/wasi-env.sh
          ./build/build-wasi.sh

      # Byte-compare freshness gate (taglib-peml): the fresh rebuild must be
      # byte-identical to the committed binary. This replaces the old
      # git-diff heuristic (wasm-freshness job) — it catches stale commits,
      # toolchain drift, and force-push artifacts equally, with zero
      # heuristics. Comment-only C++ edits produce identical bytes and pass.
      # NOTE: the WASI SDK's clang emits different bytes on macOS vs Linux
      # (same version), so the committed reference is the CI/Linux build —
      # download it from the wasi-fresh-reference artifact below.
      - name: Verify committed WASI binary is fresh
        run: |
          if ! git diff --quiet -- build/taglib-wasi.wasm; then
            echo "::error::build/taglib-wasi.wasm is stale — the fresh build differs from the committed binary."
            echo "Rebuild with 'pnpm run build:wasm' (both backends) or 'pnpm run build:wasm:wasi',"
            echo "then commit the updated binary."
            echo "For the CI/Linux reference build: download the 'wasi-fresh-reference' artifact"
            echo "from this run and commit dist/wasi/taglib-wasi.wasm as build/taglib-wasi.wasm."
            git diff --stat -- build/taglib-wasi.wasm
            exit 1
          fi
          echo "build/taglib-wasi.wasm matches the fresh build"

      - name: Upload fresh WASI binary (reference for the committed copy)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasi-fresh-reference
          path: dist/wasi/taglib-wasi.wasm
          retention-days: 1

      - name: Verify WASI artifacts
        run: |
          ls -lah dist/wasi/
          file dist/wasi/taglib-wasi.wasm
          wc -c dist/wasi/taglib-wasi.wasm

      - name: Upload WASI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasi-build
          path: |
            dist/wasi/
          retention-days: 1

  test:
    name: Test (${{ matrix.os }})
    needs: build-embind
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: embind-build
          path: .

      - name: Materialize the committed WASI binary for parity tests
        # tests/backend-adapter.ts gates its WASI instances on
        # dist/wasi/taglib-wasi.wasm (HAS_WASI). Without this copy every
        # forEachBackend parity test in this matrix silently runs
        # Emscripten-only — run 35107130104 logged `MP4 codec mapping
        # [emscripten]` and no `[wasi]` twin. Default-backend tests were never
        # affected (that path resolves build/taglib-wasi.wasm from the
        # checkout). Same fix SonarCloud already carries in sonarcloud.yml.
        #
        # windows-latest defaults to pwsh, where `mkdir -p` is not valid: it "works"
        # only by accident (PowerShell's mkdir takes -p as a path), so pin the shell.
        shell: bash
        run: |
          mkdir -p dist/wasi
          cp build/taglib-wasi.wasm dist/wasi/taglib-wasi.wasm

      - name: Run tests (Vitest)
        # tests/ and src/ both contain test files (CLAUDE.md T-1); the local gate
        # runs both, so CI must too — a guard that does not run in CI is
        # decoration (extra-state-registry.test.ts caught _mp4ItemNames to no
        # one). --expose-gc comes from vite.config.ts `test.execArgv`.
        run: pnpm exec vp test --coverage

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          # Vitest's v8/lcov reporter (vite.config.ts) writes this directly.
          path: coverage/lcov.info
          retention-days: 1

  test-wasi:
    name: Test (WASI)
    needs: build-wasi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Install dependencies
        # Vitest is a pnpm devDependency, so this job needs the Node toolchain.
        run: pnpm install --frozen-lockfile

      - name: Download WASI artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasi-build
          path: dist/wasi

      - name: Test the freshly built binary, not the committed one
        # The loader reads build/taglib-wasi.wasm (src/runtime/wasi-host-loader.ts,
        # src/runtime/unified-loader/module-loading.ts). Without this copy the job
        # downloaded the artifact and then tested the committed binary anyway,
        # so what build-wasi compiled was never executed — only size-reported.
        #
        # The committed binary still gets exercised: the main `test` job runs the
        # full suite, which defaults to the WASI backend. So `test` covers what
        # ships and this job covers what current source produces.
        run: |
          set -euo pipefail
          test -f dist/wasi/taglib-wasi.wasm
          cp dist/wasi/taglib-wasi.wasm build/taglib-wasi.wasm
          echo "Now testing freshly built WASI binary:"
          ls -l build/taglib-wasi.wasm

      - name: Run WASI tests
        # Positional filters narrow the widened `test.include` globs
        # (vite.config.ts) to the four files that exercise the WASI backend.
        run: |
          pnpm exec vp test \
            tests/wasi-host.test.ts \
            tests/wasi-write-roundtrip.test.ts \
            tests/extended-write-roundtrip.test.ts \
            tests/security.test.ts

  package-compat:
    name: Package Compatibility
    needs: build-embind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        # Version comes from packageManager in package.json — pnpm/action-setup
        # reads it, so there is no version here to drift out of sync.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache the pnpm store (content-addressed), not node_modules:
          # restoring a stale tree can mask what `pnpm install --frozen-lockfile`
          # would install.
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: "latest" resolves via the oven-sh/bun refs/tags API on
          # every run, which 503s intermittently from Actions runners
          bun-version: 1.4.2

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Quoted so YAML keeps it a string. Deno is a supported consumer
          # runtime; the cross-runtime smoke below exercises it like Bun/Node.
          deno-version: "2.9.6"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify JSR publish ships the intended file set
        # taglib-asy / taglib-qrp class: what the JSR package ships is decided
        # by jsr.json's publish.exclude plus .gitignore, and the 2.3.0 package
        # shipped .claude/**, repo dotfiles and src/**.test.ts (measured on the
        # published tarball). Dry-runs the publish and pins the exact file set
        # and the version agreement with package.json. Runs before the build
        # artifacts are downloaded so the asserted tree is the reviewable one.
        run: bash scripts/check-jsr-package-files.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: embind-build
          path: .

      - name: Cross-runtime smoke (Deno, Bun, Node × both backends)
        # tests/cross-runtime/*.ts run unmodified under every runtime and
        # assert real values for both wasm backends. A backend a runtime cannot
        # load is reported with its reason and fails the run — never a silent
        # skip — and any failed check exits non-zero. A run that executes
        # nothing also fails. Local entry point: pnpm run test:cross-runtime.
        run: bash tests/cross-runtime/run.sh

      - name: Deno - run the Deno-gated tests
        # tests/deno-*.test.ts use Deno's built-in test runner (Vitest excludes
        # them), so nothing else in this workflow would notice them rotting.
        run: pnpm run test:deno

      - name: NPM - publint
        # `pnpm exec` and a devDependency pin: without them `npx` resolves
        # `publint` from the registry at run time, so the check analyzes
        # whatever version is published that day (the same reasoning as the
        # knip step above). `pnpm exec` never fetches; note a warm pnpm store
        # can still satisfy a missing local copy with a cached version, so the
        # unconditional guarantee is CI's: cold store plus `pnpm install
        # --frozen-lockfile`.
        run: pnpm exec publint

      - name: NPM - arethetypeswrong
        run: |
          pnpm exec attw --pack --profile esm-only
          echo "Note: Using esm-only profile (CJS dynamic import warnings are expected)"

      - name: Bun - import test
        run: |
          cd /tmp
          mkdir -p bun-compat-test
          cd bun-compat-test
          bun init -y
          bun add "$GITHUB_WORKSPACE"
          cat > test.ts << 'EOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log(":: Main exports resolve correctly");
          console.log(":: Simple subpath exports resolve correctly");
          EOF
          bun run test.ts
          echo ":: Bun compatibility verified"

      - name: Bun - integration tests
        run: |
          bun test tests/bun-integration.test.ts
          echo ":: Bun integration tests passed"

      - name: Node.js - import test
        # npm here is deliberate: this step simulates an npm consumer
        # installing the package from the workspace, which is the point of the
        # check. pnpm is this repo's package manager, not the consumer's.
        run: |
          cd /tmp
          mkdir -p node-compat-test
          cd node-compat-test
          npm init -y
          npm pkg set type=module
          npm install "$GITHUB_WORKSPACE"
          cat > test.mjs << 'EOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log(":: Main exports resolve correctly");
          console.log(":: Simple subpath exports resolve correctly");
          EOF
          node test.mjs
          echo ":: Node.js compatibility verified"

      - name: Vite - browser bundle test
        # npm-backed scratch consumer again (see the Node.js import test).
        run: |
          cd /tmp
          mkdir -p vite-compat-test
          cd vite-compat-test
          npm init -y
          npm pkg set type=module
          npm install "$GITHUB_WORKSPACE"
          npm install --save-dev vite

          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><body><script type="module" src="/main.js"></script></body></html>
          HTMLEOF

          cat > main.js << 'JSEOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log("taglib-wasm browser imports OK");
          JSEOF

          npx --no-install vite build 2>&1
          echo ":: Vite build succeeded"

          # Check for server-only entry points in the bundle.
          # Note: node:fs/node:module refs from Emscripten's universal runtime are
          # expected (Vite externalizes them to empty shims). The real regression
          # signals are @wasmer/wasi-host imports, which mean Vite resolved the
          # server entry point instead of the browser one.
          if grep -rlE "@wasmer|wasi-host" dist/; then
            echo ":: Server-only imports found in Vite output bundle"
            exit 1
          fi
          echo ":: No server-only imports in browser bundle"

  size-report:
    name: Size Report
    needs: [build-wasi]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download WASI artifacts
        if: needs.build-wasi.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wasi-build
          path: wasi-build

      - name: Generate size report
        run: |
          {
            echo "## Build Size Report"
            echo ""
            echo "| Build | File | Size | Compressed (gzip) |"
            echo "|-------|------|------|-------------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # WASI build
          if [ -f wasi-build/taglib-wasi.wasm ]; then
            # Literal paths, not globs — there is no filename to mis-split.
            # shellcheck disable=SC2012
            WASI_SIZE_H=$(ls -lh wasi-build/taglib-wasi.wasm | awk '{print $5}')
            gzip -c wasi-build/taglib-wasi.wasm > /tmp/wasi.wasm.gz
            # shellcheck disable=SC2012
            WASI_GZIP_H=$(ls -lh /tmp/wasi.wasm.gz | awk '{print $5}')
            echo "| WASI SDK | taglib-wasi.wasm | $WASI_SIZE_H | $WASI_GZIP_H |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| WASI SDK | _(skipped)_ | - | - |" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "### Target Environments"
            echo "- **Emscripten**: Browser, Node.js, Web Workers"
            echo "- **WASI SDK**: Node.js (WASI), Cloudflare Workers"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    # Repository health report AND the required status check for main: branch
    # protection on main requires this job's "Summary" check (app_id 15368),
    # with enforce_admins=false — admins bypass it, which is why a direct push
    # reports "Bypassed rule violations… Required status check 'Summary' is
    # expected". Precisely because this is the one enforced check, it must gate
    # on every job that matters (see the required-jobs loop below).
    name: Summary
    needs:
      [
        lint,
        bundle,
        test-capi-cpp,
        build-embind,
        build-wasi,
        test,
        test-wasi,
        package-compat,
        size-report,
      ]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Required jobs (must pass)
          FAILED=false
          for job in lint bundle test-capi-cpp build-embind test package-compat; do
            result="${{ needs.lint.result }}"
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              bundle) result="${{ needs.bundle.result }}" ;;
              test-capi-cpp) result="${{ needs.test-capi-cpp.result }}" ;;
              build-embind) result="${{ needs.build-embind.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              package-compat) result="${{ needs.package-compat.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "- **$job**: $result" >> "$GITHUB_STEP_SUMMARY"
              FAILED=true
            else
              echo "- **$job**: success" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Optional jobs (report but don't gate on skipped)
          for job in build-wasi test-wasi size-report; do
            case "$job" in
              build-wasi) result="${{ needs.build-wasi.result }}" ;;
              test-wasi) result="${{ needs.test-wasi.result }}" ;;
              size-report) result="${{ needs.size-report.result }}" ;;
            esac
            if [ "$result" = "failure" ]; then
              echo "- **$job**: failure" >> "$GITHUB_STEP_SUMMARY"
              FAILED=true
            else
              echo "- **$job**: $result" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "CI failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo ""
            echo "All checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi
